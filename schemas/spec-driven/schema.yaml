name: spec-driven
version: 1
description: Default Superpowers workflow - proposal → specs → design → tasks → execution plan → test plan
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `superpowers/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in.
      Each capability listed here will need a corresponding spec file.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      Create one spec file per capability listed in the proposal's Capabilities section.
      - New capabilities: use the exact kebab-case name from the proposal (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name from superpowers/specs/<capability>/ when creating the delta spec at specs/<capability>/spec.md.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in superpowers/specs/<capability>/spec.md
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example:
      ```
      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Background, current state, constraints, stakeholders
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Outstanding decisions or unknowns to resolve

      Focus on architecture and approach, not line-by-line implementation.
      Reference the proposal for motivation and specs for requirements.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)

      Example:
      ```
      ## 1. Setup

      - [ ] 1.1 Create new module structure
      - [ ] 1.2 Add dependencies to package.json

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function
      - [ ] 2.2 Add CSV formatting utilities
      ```

      Reference specs for what needs to be built, design for how to build it.
      Each task should be verifiable - you know when it's done.
    requires:
      - specs
      - design

  - id: execution-plan
    generates: execution-plan.md
    description: Detailed implementation plan for executing the change
    template: execution-plan.md
    instruction: |
      Create the execution plan that turns the compact task checklist into implementation-ready steps.

      This artifact is saved as `execution-plan.md` in the current Superpowers change directory.
      Use proposal, specs, design, and tasks as context, but keep `tasks.md` as the compact
      checkbox progress file.

      The plan must:
      - Start with the implementation plan header from the template.
      - Map files to create, modify, and test before listing task steps.
      - Use project-relative paths that are portable across macOS, Linux, and Windows.
      - Break work into bite-sized checkbox steps with exact commands and expected outcomes.
      - Require test authoring first, then a comprehensive review of those tests before production code.
      - Block production-code steps until the test review is approved or gaps are fixed.
      - Keep red tests focused on driving implementation; broad post-diff coverage planning and evidence belong in `test-plan.md`.
      - Avoid placeholders such as `TBD`, `TODO`, `implement later`, or vague directives.

      After writing the complete plan, look at the spec with fresh eyes and check the plan against it. This is a checklist you run yourself — not a subagent dispatch.
      **1. Spec coverage:** Skim each section/requirement in the spec. Can you point to a task that implements it? List any gaps.
      **2. Placeholder scan:** Search your plan for red flags — any of the patterns from the "No Placeholders" section above. Fix them.
      **3. Type consistency:** Do the types, method signatures, and property names you used in later tasks match what you defined in earlier tasks? A function called `clearLayers()` in Task 3 but `clearFullLayers()` in Task 7 is a bug.
      If you find issues, fix them inline. No need to re-review — just fix and move on. If you find a spec requirement with no task, add the task.
      
      Example:
      ````
      ## Task Plan
      ### Task 1: [Component or Behavior]

      **Files:**
      - Create: `path/to/file.ts`
      - Modify: `path/to/existing.ts`
      - Test: `test/path/to/test-file.test.ts`

      - [ ] **Step 1: Write the failing test**

      ```ts
      it('describes the specific behavior', () => {
        expect(actualBehavior()).toBe(expectedValue);
      });
      ```

      - [ ] **Step 2: Run test to verify it fails**

      Run: `pnpm exec vitest run test/path/to/test-file.test.ts`
      Expected: FAIL for the missing behavior, not because of syntax errors or incorrect test setup.

      - [ ] **Step 3: Review test coverage before production code**

      Check: requirement coverage, edge cases, negative paths, assertion strength, regression sensitivity, and cross-platform path behavior when paths are involved.
      Expected: Review either approves the tests or identifies gaps that are fixed before Step 4.

      - [ ] **Step 4: Write minimal implementation**

      ```ts
      export function actualBehavior() {
        return expectedValue;
      }
      ```

      - [ ] **Step 5: Run verification**

      Run: `pnpm exec vitest run test/path/to/test-file.test.ts`
      Expected: PASS with the new test covering the behavior.

      - [ ] **Step 6: Commit when appropriate**

      ```bash
      git add test/path/to/test-file.test.ts path/to/existing.ts
      git commit -m "feat: add specific behavior"
      ```
      ````
     
      Reference `tasks.md` for task ordering and tracking, but add the concrete TDD detail here.
    requires:
      - tasks

  - id: test-plan
    generates: test-plan.md
    description: Test coverage plan and post-implementation hardening record
    template: test-plan.md
    instruction: |
      Create the test plan that maps intended coverage before implementation and records Test Hardening after implementation.

      This artifact is saved as `test-plan.md` in the current Superpowers change directory.
      Use proposal, specs, design, tasks, and execution-plan as context. Do not duplicate the full implementation plan.

      The plan must:
      - Distinguish red tests in `execution-plan.md` from post-implementation Test Hardening in `test-plan.md`.
      - Include a requirement/scenario coverage matrix with unit, integration, E2E, manual, or not-applicable coverage decisions.
      - Start by analyzing which earlier tests were insufficient or not broad enough, then describe which tests this stage added or strengthened.
      - Include boundary, abnormal, failure, non-critical-path, integration, and cross-platform path risks where relevant.
      - Include deferred or manual coverage only with specific reasons.
      - Make Test Hardening completion depend on the concrete status rows in the test plan tables, not on a standalone completion checkbox.
      - Use complete table statuses such as `covered`, `passed`, or `not applicable`; leave unfinished rows as `planned`, `failing`, or blank.
    requires:
      - execution-plan

apply:
  requires: [test-plan]
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    When implementation tasks are complete, continue into Test Hardening using `test-plan.md`.
    Apply completion requires both all tasks complete and every concrete test/status row in test-plan.md complete.
    Pause if you hit blockers, failing hardening tests, unresolved defects, ambiguous diff ownership, or unclear requirements.
