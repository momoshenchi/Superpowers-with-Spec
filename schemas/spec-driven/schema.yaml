name: spec-driven
version: 1
description: Default Superpowers workflow - proposal → specs → design → tasks → execution plan → test plan
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `superpowers/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Attachments** (optional): Reference supporting change-local files with Markdown targets beginning `attachments/`. For each reference, explain what the file is, why it matters, and whether it is normative, illustrative, or background context.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in.
      Each capability listed here will need a corresponding spec file.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      Create one spec file per capability listed in the proposal's Capabilities section.
      - New capabilities: use the exact kebab-case name from the proposal (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name from superpowers/specs/<capability>/ when creating the delta spec at specs/<capability>/spec.md.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in superpowers/specs/<capability>/spec.md
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example:
      ```
      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
      Specs may reference supporting change-local files with Markdown targets beginning `attachments/`.
      When they do, explain what each file is, why it matters, which requirement or
      scenario it supports, and whether it is normative, illustrative, or background context.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections (follow the template; keep Context rich when helpful, but do not
      bury the technical starting point only inside Context):
      - **Context**: Background, motivation, constraints, stakeholders
      - **Current system**: Technical landscape *slice for this change* (modules,
        entry points, data flow). Title is exactly `## Current system`.
      - **Relationship to existing tech** (under Current system): How this work
        relates to what already exists. Use relations
        `reuse | extend | replace | boundary | retire` and always give a
        **Pointer** (path, symbol, command, or documented section). Bare
        "reuse existing" without a pointer is not acceptable.
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes
      - **Decisions**: Key technical choices with rationale.
          - **Major** decisions (new source of truth; cross-subsystem boundary;
            security, billing, idempotency, or recovery behavior; irreversible
            migration; important new dependency; or user-declared module-scale
            work): record a comparison of **at least three** options (usually
            after explore diverged), with dimensions, explicit choice, and
            trade-offs. Design converges and records; it should not re-brainstorm
            from scratch.
          - **Minor** decisions (local naming, single-helper fix, file placement):
            short rationale only—do **not** invent three fake alternatives.
      - **Contracts**: Stable anchors for API/CLI fields, states, and errors this
        change touches. Always include the section. If nothing changes on those
        surfaces, write an explicit line such as
        `N/A — no API/state/error surface change`.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong.
        Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Outstanding decisions or unknowns to resolve

      Visual identity (optional, UI only):
      - A repository **visual DESIGN.md** means the google-labs
        `@google/design.md` idea (YAML tokens + prose identity for coding
        agents)—**not** change-local `design.md`.
      - UI-facing changes: when a visual DESIGN.md exists, read and **cite** it
        from Current system or Relationship (pointer). Treat its tokens and
        Do's/Don'ts as visual constraints.
      - Look-and-feel token or rule changes: update that visual DESIGN.md in the
        **same** change via tasks; change design may describe only the delta.
      - Do **not** paste the full visual system into change design.md.
      - UI change with no visual DESIGN.md found: note that existing
        components/CSS are the de facto guide; mockups may still use
        `attachments/`.

      Focus on architecture and approach, not line-by-line implementation.
      Reference the proposal for motivation and specs for requirements.
      Design docs may reference supporting change-local files with Markdown
      targets beginning `attachments/`. When they do, explain what each file is,
      why it matters, and whether it is normative, illustrative, or background
      context. Diagrams and mockups for the change belong under `attachments/`.

      Good design docs explain the "why" behind technical decisions and leave a
      stranger able to answer: where we start, what we reuse (with pointers),
      what contracts matter, and why major options lost.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Start every dispatch unit with `# <number>. <scope>`
      - Use `##` headings only to group delivery areas inside that dispatch unit
      - Each detailed task MUST be a checkbox: `- [ ] <number>.<task-number> Task description`
      - Make each dispatch unit a coherent, independently reportable delivery area and order units by dependency
      - A dispatch unit is a logical allocation boundary, not a live subagent identity. Record assignee policy in `execution-plan.md`. A coordinator may dispatch one unit, combine compatible units, or execute all units sequentially. Legacy `# <number>. agent<logical-id> — <scope>` headings remain acceptable.

      Example:
      ```
      # 1. Schema and template foundation

      ## Templates

      - [ ] 1.1 Create new module structure
      - [ ] 1.2 Add dependencies to package.json

      # 2. Core implementation

      ## Delivery

      - [ ] 2.1 Implement data export function
      - [ ] 2.2 Add CSV formatting utilities
      ```

      Reference specs for what needs to be built, design for how to build it.
      Each task should be verifiable - you know when it's done.
    requires:
      - specs
      - design

  - id: execution-plan
    generates: execution-plan.md
    description: Detailed implementation plan for executing the change
    template: execution-plan.md
    instruction: |
      Create the execution plan that coordinates the task-list dispatch units for implementation.

      This artifact is saved as `execution-plan.md` in the current Superpowers change directory.
      Use proposal, specs, design, and tasks as context, but keep `tasks.md` as the compact
      checkbox progress file.

      The plan must:
      - Map files to create, modify, and test with project-relative paths that are portable across macOS, Linux, and Windows.
      - Keep `tasks.md` as the implementation progress source of truth, then expand every detailed checkbox task in its dispatch unit into a concrete Step 1–5 execution sequence here under clean `### <number>. <scope>` headings (do not nest code-wrapped `# ...` heading text).
      - List each logical dispatch unit, its ownership boundary, dependencies, assignee policy, safe parallel eligibility, integration order, and handoff evidence in a Dispatch Coordination table.
      - State that a dispatch unit is an allocation boundary, not a required one-to-one subagent assignment; put assignee policy in the coordination table rather than in `tasks.md` headings. Accept legacy `agent<logical-id>` headings as dispatch units.
      - For every detailed task, provide concrete files, focused tests, commands, expected results, implementation detail, verification, and self-review/handoff guidance across its Step 1–5 sequence.
      - Treat those five steps as task-level execution detail, not as separate subagent assignments or required 2–5 minute units.
      - Require workers to run the verification named by their detailed tasks and self-review before handoff.
      - Require one formal cross-unit review and full validation only after all dispatch units are integrated; fixes receive targeted verification without a second complete review unless explicitly requested.
      - Keep broad post-diff coverage planning and evidence in `test-plan.md`.
      - Avoid placeholders such as `TBD`, `TODO`, `implement later`, or vague directives.
      - Reference supporting change-local files with Markdown targets beginning `attachments/` when useful, and explain what each file is, why it matters, whether it is normative, illustrative, or background context, and which task or requirement it supports.

      After writing the complete plan, look at the spec with fresh eyes and check the plan against it. This is a checklist you run yourself — not a subagent dispatch.
      **1. Spec coverage:** Skim each section/requirement in the spec. Can you point to a dispatch unit that implements it? List any gaps.
      **2. Placeholder scan:** Search your plan for TBD, TODO, "implement later", or vague directives. Every task must be concrete and completable.
      **3. Contradiction / orphan check:** Check for internal contradictions and for tasks that do not map back to a requirement.
      **4. Type consistency:** Named types, fields, and behaviors should match the specs.
      **5. Completeness:** Gaps, placeholders, contradictions, orphans, and type mismatches should be resolved before implementation starts.
    requires:
      - tasks

  - id: test-plan
    generates: test-plan.md
    description: Test coverage plan and post-implementation hardening record
    template: test-plan.md
    instruction: |
      Create the test plan that maps intended coverage before implementation and records Test Hardening after implementation.

      This artifact is saved as `test-plan.md` in the current Superpowers change directory.
      Use proposal, specs, design, tasks, and execution-plan as context. Do not duplicate the full implementation plan.

      The plan must:
      - Distinguish worker-level verification in detailed `tasks.md` from post-integration Test Hardening in `test-plan.md`.
      - Include a requirement/scenario coverage matrix with unit, integration, E2E, manual, or not-applicable coverage decisions.
      - Start by analyzing which earlier tests were insufficient or not broad enough, then describe which tests this stage added or strengthened.
      - Include boundary, abnormal, failure, non-critical-path, integration, and cross-platform path risks where relevant.
      - Include deferred or manual coverage only with specific reasons.
      - Make Test Hardening completion depend on concrete testing/hardening status rows outside any `## Final Quality Gates` table, not on a standalone completion checkbox. Final-gate rows are evaluated separately after Test Hardening.
      - Use complete table statuses such as `covered`, `passed`, or `not applicable`; leave unfinished rows as `planned`, `failing`, or blank.
    requires:
      - execution-plan

apply:
  requires: [test-plan]
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    When implementation tasks are complete, continue into Test Hardening using `test-plan.md`.
    Apply completion requires all tasks, every concrete Test Hardening row outside `## Final Quality Gates`, and every applicable final gate to be complete.
    Pause if you hit blockers, failing hardening tests, unresolved defects, ambiguous diff ownership, or unclear requirements.
